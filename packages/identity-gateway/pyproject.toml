[project]
name = "identity-gateway"
version = "0.1.0"
description = "HomeFront agent identity + MCP authorization gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
  "atlas-enricher",
  "mcp-tools",
]

[project.optional-dependencies]
# SupabaseAgentRepository (identity_gateway.supabase_repo)
supabase = ["supabase>=2.7"]

[tool.uv.sources]
atlas-enricher = { path = "../atlas-enricher", editable = true }
mcp-tools = { path = "../mcp-tools", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
