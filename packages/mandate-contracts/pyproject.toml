[project]
name = "mandate-contracts"
version = "0.1.0"
description = "Shared Mandate contracts: MCP tool inputs, mandate token claims, decision events, DynamoDB keys"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "pyjwt>=2.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
