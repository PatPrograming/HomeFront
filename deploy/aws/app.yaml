AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  HomeFront app: one ECS Fargate task (gateway + the chat agents it starts) behind an internal
  load balancer, reached only through CloudFront (HTTPS) via a CloudFront VPC origin. The console
  is a static Vite build in a private S3 bucket behind the same distribution, so /api and /mcp are
  same-origin with the console.

Parameters:
  ImageUri:
    Type: String
    Description: Gateway image in ECR, for example <account>.dkr.ecr.us-east-1.amazonaws.com/homefront-gateway:<git-sha>
  SecretArn:
    Type: String
    Description: The homefront/runtime secret (output of the foundation stack)
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different AZs with a route to an internet gateway (the default VPC's subnets)
  CloudFrontPrefixListId:
    Type: String
    Default: pl-3b927c52
    Description: Managed prefix list com.amazonaws.global.cloudfront.origin-facing in us-east-1
  TaskCpu:
    Type: String
    Default: "1024"
  TaskMemory:
    Type: String
    Default: "2048"
  MandateTable:
    Type: String
    Default: mandate
  TablePrefix:
    Type: String
    Default: homefront-
  PolicyStoreId:
    Type: String
    Default: Fmx8fLovCMpXgABUM1bHhb
  AvpPolicyNames:
    Type: String
    Default: "{}"
    Description: JSON map of AVP policy id to readable name (AVP_POLICY_NAMES in Backend/infra/.env.aws; not secret)
  GuardrailId:
    Type: String
    Default: l74ju5pcrcdg
  GuardrailVersion:
    Type: String
    Default: "2"
  AgentModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-5
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_MLfQpodxG
  CognitoStaffClientId:
    Type: String
    Default: 5be15oitnpm14bg188jpqqs9qv
  CognitoAgentClientId:
    Type: String
    Default: 7aslk40jv9ikchoouqd00avdnp
  CognitoDomain:
    Type: String
    Default: https://mandate-a10-hack-2026.auth.us-east-1.amazoncognito.com
  SesFromAddress:
    Type: String
    Default: ""
    Description: SES-verified sender. Empty = email stays simulated and the role gets no SES permission.

  GrantCognitoAdmin:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      "true" once the Admin-Roles work (admin tab: people and roles) is merged; its routes list users and change
      group membership. main today calls no Cognito admin API.

Conditions:
  HasSes: !Not [!Equals [!Ref SesFromAddress, ""]]
  HasCognitoAdmin: !Equals [!Ref GrantCognitoAdmin, "true"]

Resources:
  # ---------------------------------------------------------------- logs
  GatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /homefront/gateway
      RetentionInDays: 14

  # ---------------------------------------------------------------- IAM
  # Pulls the image, writes logs, and reads the one secret to inject it. Not used by the app.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-runtime-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SecretArn

  # What the gateway and its agents may do. Replaces the developer's Workshop Studio keys.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: homefront-gateway
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TablesItemsOnly # no CreateTable/DeleteTable: the tables already exist
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:DescribeTable
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MandateTable}
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MandateTable}/index/*
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}*
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}*/index/*
              - Sid: CedarDecisions
                Effect: Allow
                Action: verifiedpermissions:IsAuthorized
                Resource: !Sub arn:${AWS::Partition}:verifiedpermissions::${AWS::AccountId}:policy-store/${PolicyStoreId}
              - Sid: AgentModelThroughInferenceProfiles
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-5*
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-5-5*
                  # A cross-region profile routes to the model in any US region, so the model ARN
                  # is region-wildcarded, but only reachable through one of the profiles above.
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-5*
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-haiku-5-5*
              - Sid: GuardrailScan
                Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${GuardrailId}
        - !If
          - HasSes
          - PolicyName: homefront-ses
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: SendFromTheConfiguredSenderOnly
                  Effect: Allow
                  Action: ses:SendEmail
                  Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
                  Condition:
                    StringEquals:
                      ses:FromAddress: !Ref SesFromAddress
                - Sid: ReadSenderStatus
                  Effect: Allow
                  Action:
                    - ses:GetEmailIdentity
                    - ses:ListEmailIdentities
                  Resource: "*"
          - !Ref AWS::NoValue
        - !If
          - HasCognitoAdmin
          - PolicyName: homefront-cognito-admin
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: AdminTabPeopleAndGroups
                  Effect: Allow
                  Action:
                    - cognito-idp:ListUsers
                    - cognito-idp:ListUsersInGroup
                    - cognito-idp:AdminAddUserToGroup
                    - cognito-idp:AdminRemoveUserFromGroup
                  Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
          - !Ref AWS::NoValue

  # ---------------------------------------------------------------- network
  # The load balancer takes traffic only from CloudFront's origin-facing addresses (VPC origin).
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HomeFront internal ALB - CloudFront VPC origin only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing

  # The task takes traffic only from the load balancer. Outbound is open (Bedrock, Cognito,
  # DynamoDB, the government APIs), through its public IP, so no NAT gateway is needed.
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HomeFront gateway task - from the ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: ALB to uvicorn

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "300" # MCP streams and chat polls stay open longer than the 60 s default
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"

  GatewayTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /api/v1/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "10"

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GatewayTargetGroup

  # ---------------------------------------------------------------- ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: homefront
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  GatewayTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: homefront-gateway
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: gateway
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LinuxParameters:
            InitProcessEnabled: true # a real init reaps the agent child processes and forwards SIGTERM
          StopTimeout: 30
          HealthCheck:
            Command:
              - CMD
              - /app/.venv/bin/python
              - -c
              - "import urllib.request,sys; sys.exit(0 if b'ok' in urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=4).read() else 1)"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GatewayLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: gateway
          Environment:
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
            - { Name: COGNITO_REGION, Value: !Ref AWS::Region }
            - { Name: COGNITO_USER_POOL_ID, Value: !Ref CognitoUserPoolId }
            - { Name: COGNITO_STAFF_CLIENT_ID, Value: !Ref CognitoStaffClientId }
            - { Name: COGNITO_AGENT_CLIENT_ID, Value: !Ref CognitoAgentClientId }
            - { Name: COGNITO_DOMAIN, Value: !Ref CognitoDomain }
            - { Name: MANDATE_TABLE, Value: !Ref MandateTable }
            - { Name: AVP_POLICY_STORE_ID, Value: !Ref PolicyStoreId }
            - { Name: AVP_POLICY_NAMES, Value: !Ref AvpPolicyNames }
            - { Name: GUARDRAIL_ID, Value: !Ref GuardrailId }
            - { Name: GUARDRAIL_VERSION, Value: !Ref GuardrailVersion }
            - { Name: AGENT_BEDROCK_MODEL_ID, Value: !Ref AgentModelId }
            - { Name: DYNAMODB_TABLE_PREFIX, Value: !Ref TablePrefix }
            - { Name: AGENT_STORE, Value: dynamodb }
            - { Name: HOMEFRONT_AUTOSTART_AGENT, Value: "1" }
            - { Name: HOMEFRONT_LIVE_SCRAPE, Value: "1" }
            - { Name: HOMEFRONT_EMAIL_FROM, Value: !Ref SesFromAddress }
            # The console is same-origin through CloudFront; localhost stays for local development.
            - Name: ALLOWED_ORIGINS
              Value: !Sub https://${Distribution.DomainName},http://localhost:3000
            # MCP DNS-rebinding protection: CloudFront forwards the ALB name as Host.
            - Name: MANDATE_MCP_ALLOWED_HOSTS
              Value: !Sub 127.0.0.1:*,localhost:*,${Alb.DNSName},${Distribution.DomainName}
          # Injected at start from Secrets Manager; never in the image, the template or the logs.
          Secrets:
            - { Name: MANDATE_SIGNING_SECRET, ValueFrom: !Sub "${SecretArn}:MANDATE_SIGNING_SECRET::" }
            - { Name: COGNITO_AGENT_CLIENT_SECRET, ValueFrom: !Sub "${SecretArn}:COGNITO_AGENT_CLIENT_SECRET::" }
            - { Name: DATA_GOV_API_KEY, ValueFrom: !Sub "${SecretArn}:DATA_GOV_API_KEY::" }
            - { Name: CENSUS_API_KEY, ValueFrom: !Sub "${SecretArn}:CENSUS_API_KEY::" }
            - { Name: OPENFDA_API_KEY, ValueFrom: !Sub "${SecretArn}:OPENFDA_API_KEY::" }
            - { Name: EIA_API_KEY, ValueFrom: !Sub "${SecretArn}:EIA_API_KEY::" }
            - { Name: NREL_API_KEY, ValueFrom: !Sub "${SecretArn}:NREL_API_KEY::" }
            - { Name: NASA_API_KEY, ValueFrom: !Sub "${SecretArn}:NASA_API_KEY::" }
            - { Name: NOAA_CDO_TOKEN, ValueFrom: !Sub "${SecretArn}:NOAA_CDO_TOKEN::" }
            - { Name: NPS_API_KEY, ValueFrom: !Sub "${SecretArn}:NPS_API_KEY::" }
            - { Name: BLS_API_KEY, ValueFrom: !Sub "${SecretArn}:BLS_API_KEY::" }
            - { Name: EPA_API_KEY, ValueFrom: !Sub "${SecretArn}:EPA_API_KEY::" }
            - { Name: FEC_API_KEY, ValueFrom: !Sub "${SecretArn}:FEC_API_KEY::" }
            - { Name: FCC_API_KEY, ValueFrom: !Sub "${SecretArn}:FCC_API_KEY::" }

  GatewayService:
    Type: AWS::ECS::Service
    DependsOn: AlbListener
    Properties:
      ServiceName: homefront-gateway
      Cluster: !Ref Cluster
      TaskDefinition: !Ref GatewayTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      # Exactly one task: running agents and MCP sessions live in that task's memory. A deploy
      # stops the old task before starting the new one (about a minute of downtime).
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 90
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: gateway
          ContainerPort: 8080
          TargetGroupArn: !Ref GatewayTargetGroup

  # ---------------------------------------------------------------- console (S3 + CloudFront)
  ConsoleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  ConsoleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConsoleBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadsThroughOAC
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${ConsoleBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  ConsoleOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-console
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  GatewayVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub ${AWS::StackName}-gateway
        Arn: !Ref Alb
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only # CloudFront to the internal ALB stays on the AWS network

  # The console uses client-side routes (react-router): any path without a file extension
  # gets index.html. Runs only on the console behavior, so /api 404s stay real 404s.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for console routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var last = request.uri.split('/').pop();
          if (last.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: HomeFront console and gateway
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Origins:
          - Id: console
            DomainName: !GetAtt ConsoleBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ConsoleOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: gateway
            DomainName: !GetAtt Alb.DNSName
            VpcOriginConfig:
              VpcOriginId: !GetAtt GatewayVpcOrigin.Id
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: console
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: gateway
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
          - PathPattern: /mcp*
            TargetOriginId: gateway
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

Outputs:
  ConsoleUrl:
    Value: !Sub https://${Distribution.DomainName}/
  DistributionId:
    Value: !Ref Distribution
  ConsoleBucketName:
    Value: !Ref ConsoleBucket
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt GatewayService.Name
  LogGroupName:
    Value: !Ref GatewayLogGroup
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
