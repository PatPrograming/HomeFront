[project]
name = "atlas-enricher"
version = "0.1.0"
description = "Local read-only MITRE ATLAS enricher for HomeFront agent IAM"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
