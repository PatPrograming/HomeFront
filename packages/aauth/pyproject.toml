[project]
name = "aauth"
version = "0.1.0"
description = "HomeFront AAuth agent identity + ID-JAG shaped assertion helpers"
requires-python = ">=3.11"
dependencies = ["pyjwt[crypto]>=2.15", "cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
