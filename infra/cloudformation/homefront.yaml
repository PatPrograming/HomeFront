AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  HomeFront user auth (Amazon Cognito) and data (Amazon DynamoDB).
  Replaces the Supabase project: user pool + web app client, the profiles /
  usernames / agents tables, and a least-privilege IAM policy for the backend.
  Deploy with infra/deploy.sh.

Parameters:
  Prefix:
    Type: String
    Default: homefront-
    AllowedPattern: "^[a-z0-9-]{1,32}$"
    Description: Name prefix for every resource. Must match DYNAMODB_TABLE_PREFIX.

Resources:
  # --- Auth -------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    # Retained if the stack is deleted, so accounts aren't lost by accident.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${Prefix}users"
      # Sign in with email (as Supabase did); emails are case-insensitive.
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      # `name` becomes the profile's full_name on first sign-in.
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      # Cognito's built-in sender: fine for development, capped at a few
      # emails per day. Switch to SES (EmailSendingAccount: DEVELOPER) for prod.
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${Prefix}web"
      UserPoolId: !Ref UserPool
      # Public browser client: no secret; SRP so the password never leaves the browser.
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ReadAttributes: [email, email_verified, name]
      WriteAttributes: [email, name]

  # --- Data -------------------------------------------------------------
  # Key schemas must match Backend/app/core/dynamodb.py TABLES
  # (checked by Backend/tests/test_infra.py).
  ProfilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Prefix}profiles"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  UsernamesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Prefix}usernames"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: username
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AgentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Prefix}agents"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # --- Access -----------------------------------------------------------
  # Attach to whatever runs the backend (an IAM user for local dev, or the
  # App Runner / ECS / Lambda role). Browsers never touch DynamoDB: this
  # policy is the replacement for Supabase's RLS on direct table access.
  BackendDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: HomeFront backend access to its DynamoDB tables only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: HomeFrontTables
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Scan
              - dynamodb:ConditionCheckItem
            Resource:
              - !GetAtt ProfilesTable.Arn
              - !GetAtt UsernamesTable.Arn
              - !GetAtt AgentsTable.Arn

Outputs:
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref WebClient
  TablePrefix:
    Value: !Ref Prefix
  BackendDataPolicyArn:
    Value: !Ref BackendDataPolicy
